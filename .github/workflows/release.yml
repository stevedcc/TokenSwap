name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # A dry run of the signed macOS build (issue #240): the same signing, notarisation and checks as a tag run, then the
  # archive, the pkg and the notary logs are uploaded as artifacts. A dispatch never publishes, whatever the input says;
  # the input makes that explicit in the UI. The macos-signing environment allows only main and v* tags.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (a dispatch never publishes a release)'
        type: boolean
        default: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The unit tests ci.yml runs (its Linux leg also runs E2E against a Debug AOT binary; the
      # hardware categories need real devices). The build legs below smoke-test each shipped binary.
      - name: Install bubblewrap (sandbox tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --unshare-pid --die-with-parent --ro-bind / / --proc /proc --dev /dev -- /bin/true

      # As in ci.yml: the JIT test host loads the YubiKey SDK's own Yubico.NativeShims.so, which links
      # libpcsclite.so.1 (SdkFido2KeysTests' salt tests go through its ECDH). Only this job installs it; the build
      # legs below smoke-test the shipped binary, which links tswap's PC/SC stand-in and must start without it.
      - name: libpcsclite for the JIT test host
        run: sudo apt-get install -y libpcsclite1

      - name: Test
        env:
          CI_REQUIRE_BWRAP: '1'
        shell: bash
        run: |
          set -o pipefail
          TSWAP_TEST_KEY=$(openssl rand -hex 32) dotnet test TokenSwap.slnx \
            --filter "Category!=E2E&Category!=SecureEnclave&Category!=Tpm&Category!=TpmWindows&Category!=YubiKey" | tee "$RUNNER_TEMP/test.log"
          # A filter that matches no tests exits 0: require one summary line with tests in it.
          grep -qE '^Passed! +- Failed: +0, Passed: +[1-9][0-9]*,' "$RUNNER_TEMP/test.log" \
            || { echo "::error::no 'Passed!' summary with tests in it: no tests ran, or some failed" >&2; exit 1; }

  verify-version:
    name: Verify Version
    # Tag pushes only; a dispatch has no tag to compare (the jobs below accept it as skipped).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches csproj version
        run: |
          TAG="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG#v}"
          CSPROJ_VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' TswapCli/TswapCli.csproj)
          echo "Tag version:    $TAG_VERSION"
          echo "Csproj version: $CSPROJ_VERSION"
          if [ "$TAG_VERSION" != "$CSPROJ_VERSION" ]; then
            echo "ERROR: Tag $TAG does not match <Version>$CSPROJ_VERSION</Version> in TswapCli/TswapCli.csproj"
            exit 1
          fi

  build:
    needs: [test, verify-version]
    # A skipped need (verify-version on a dispatch) would otherwise skip this job.
    if: always() && needs.test.result == 'success' && (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped')
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: win-x64
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Brief T18: the version each smoke test expects the shipped binary's `tswap --version` to report (package.sh
      # --smoke reads TSWAP_EXPECT_VERSION; the Windows smoke checks it itself): the tag without its v on a tag run (a
      # prerelease tag keeps its suffix, v0.3.0-rc.1 -> 0.3.0-rc.1, as verify-version compares), else TswapCli.csproj's
      # <Version> (a dispatch, a PR or a push to main).
      - name: Expected version (for the smoke tests' tswap --version)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' TswapCli/TswapCli.csproj | head -n 1)
          fi
          if [ -z "$version" ]; then
            echo "::error::no version: neither a tag nor a <Version> in TswapCli/TswapCli.csproj" >&2
            exit 1
          fi
          echo "TSWAP_EXPECT_VERSION=$version" >> "$GITHUB_ENV"
          echo "expected version: $version"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install native build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish
        run: >
          dotnet publish TswapCli/TswapCli.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --output ./publish/${{ matrix.rid }}

      # Run the shipped (Release, NativeAOT) binary once on its own platform: a command that needs
      # no vault, so a binary that doesn't start fails the release here.
      # Package here, on the binary's own platform, then extract the archive into an empty folder
      # and run what is in it: the smoke test runs the shipped bytes with the shipped permissions
      # (upload-artifact doesn't keep the execute bit, so the archive is made before the upload).
      # `prompt-hash` needs no vault. contrib/packaging/package.sh also packs the macOS Secure Enclave
      # dylib next to the binary, and on macOS makes and unlocks a throwaway Secure Enclave vault with
      # the unpacked tswap, which loads the dylib from the archive (issue #238); CI runs the same script.
      - name: Package and smoke-test the archive (Linux, macOS)
        if: runner.os != 'Windows'
        timeout-minutes: 10
        shell: bash
        run: bash contrib/packaging/package.sh "${{ matrix.rid }}" "./publish/${{ matrix.rid }}" dist --smoke

      - name: Package and smoke-test the archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path ./publish/${{ matrix.rid }}/tswap.exe -DestinationPath dist/tswap-${{ matrix.rid }}.zip
          $check = Join-Path $env:RUNNER_TEMP 'tswap-check'
          Expand-Archive dist/tswap-${{ matrix.rid }}.zip -DestinationPath $check
          # Brief T18: the whole stdout of --version, its line ending trimmed, is `tswap <expected version>`.
          $out = & (Join-Path $check 'tswap.exe') --version
          $code = $LASTEXITCODE
          $line = ($out | Out-String).TrimEnd("`r", "`n")
          if ($code -ne 0 -or $line -ne "tswap $env:TSWAP_EXPECT_VERSION") {
            Write-Output "::error::tswap --version printed '$line' (exit $code), expected 'tswap $env:TSWAP_EXPECT_VERSION'"
            exit 1
          }
          Write-Output "tswap --version: $line"
          & (Join-Path $check 'tswap.exe') prompt-hash
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The YubiKey smoke package.sh runs on Linux and macOS (YubiKey SDK stage 1, task 4): a serial no YubiKey has,
          # never --replace, so the only expected outcome is the refusal.
          $ErrorActionPreference = 'Continue'
          $out = (& (Join-Path $check 'tswap.exe') yubikey setup --touch --serial 2147483647 2>&1 | ForEach-Object { "$_" }) -join "`n"
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -eq 0 -or -not $out.Contains('YubiKey 2147483647 is not plugged in')) {
            Write-Output "::error::tswap yubikey setup --touch --serial 2147483647 should refuse with 'YubiKey 2147483647 is not plugged in' (exit $code)"
            exit 1
          }
          exit 0

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: tswap-${{ matrix.rid }}
          path: dist/
          if-no-files-found: error

  # The macOS build, signed and notarised (issue #240; plan docs/superpowers/plans/2026-11-07-macos-signing.md). Bound
  # to the macos-signing environment, which holds the secrets and waits for the owner's approval on every run; it starts
  # only once the tests passed, so no approval, signing or notarisation is spent on a red commit. Upstream
  # (stevedcc/TokenSwap) a missing secret fails the release; a fork builds the archive unsigned, with no pkg.
  # The report-only checks (contrib/packaging/macos/runner-checks.sh) gate once TSWAP_MACOS_GATE_RUNNER_CHECKS: '1' is
  # added to env: below, after the first dry run's strings are in the checks (plan task 10).
  build-macos:
    name: Build osx-arm64 (signed)
    needs: [test, verify-version]
    if: always() && needs.test.result == 'success' && (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped')
    runs-on: macos-latest
    # Two notary waits of up to 40 minutes each, plus the build, the smoke and the install test.
    timeout-minutes: 120
    permissions:
      contents: read
    environment: macos-signing
    env:
      SIGNING_REQUIRED: ${{ github.repository == 'stevedcc/TokenSwap' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Brief T18: the version each smoke test expects the shipped binary's `tswap --version` to report (package.sh
      # --smoke reads TSWAP_EXPECT_VERSION; the Windows smoke checks it itself): the tag without its v on a tag run (a
      # prerelease tag keeps its suffix, v0.3.0-rc.1 -> 0.3.0-rc.1, as verify-version compares), else TswapCli.csproj's
      # <Version> (a dispatch, a PR or a push to main).
      - name: Expected version (for the smoke tests' tswap --version)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' TswapCli/TswapCli.csproj | head -n 1)
          fi
          if [ -z "$version" ]; then
            echo "::error::no version: neither a tag nor a <Version> in TswapCli/TswapCli.csproj" >&2
            exit 1
          fi
          echo "TSWAP_EXPECT_VERSION=$version" >> "$GITHUB_ENV"
          echo "expected version: $version"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Whether each input is there (true/false only: no value reaches this step).
      - name: Signing inputs
        id: inputs
        shell: bash
        env:
          HAVE_MACOS_SIGN_APP_P12_BASE64: ${{ secrets.MACOS_SIGN_APP_P12_BASE64 != '' }}
          HAVE_MACOS_SIGN_INSTALLER_P12_BASE64: ${{ secrets.MACOS_SIGN_INSTALLER_P12_BASE64 != '' }}
          HAVE_MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD != '' }}
          HAVE_MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 != '' }}
          HAVE_MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID != '' }}
          HAVE_MACOS_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID != '' }}
          HAVE_MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID != '' }}
        run: |
          set -euo pipefail
          if [ "$SIGNING_REQUIRED" != true ]; then
            echo "::warning::not stevedcc/TokenSwap: the macOS archive is built unsigned, and there is no pkg"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=
          for name in MACOS_SIGN_APP_P12_BASE64 MACOS_SIGN_INSTALLER_P12_BASE64 MACOS_SIGN_P12_PASSWORD \
                      MACOS_NOTARY_KEY_P8_BASE64 MACOS_NOTARY_ISSUER_ID MACOS_NOTARY_KEY_ID MACOS_TEAM_ID; do
            have="HAVE_$name"
            [ "${!have}" = true ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::the macos-signing environment lacks:$missing (plan G5); the release is not built unsigned (D5)"
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Throwaway keychain with the Developer ID identities
        id: kc
        if: steps.inputs.outputs.signed == 'true'
        shell: bash
        env:
          MACOS_SIGN_APP_P12_BASE64: ${{ secrets.MACOS_SIGN_APP_P12_BASE64 }}
          MACOS_SIGN_INSTALLER_P12_BASE64: ${{ secrets.MACOS_SIGN_INSTALLER_P12_BASE64 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
        run: bash contrib/packaging/sign-macos.sh keychain-setup

      # The shim (libtswapse.dylib) is signed inside the build, before it is embedded into tswap for installscript.
      - name: Publish (signed shim)
        if: steps.inputs.outputs.signed == 'true'
        run: >
          dotnet publish TswapCli/TswapCli.csproj
          --configuration Release
          --runtime osx-arm64
          --output ./publish/osx-arm64
          -p:TswapMacSignIdentity=${{ steps.kc.outputs.app_identity }}
          -p:TswapMacSignKeychain=${{ steps.kc.outputs.keychain }}

      - name: Publish (unsigned, fork)
        if: steps.inputs.outputs.signed != 'true'
        run: >
          dotnet publish TswapCli/TswapCli.csproj
          --configuration Release
          --runtime osx-arm64
          --output ./publish/osx-arm64

      - name: Sign tswap and verify both files
        if: steps.inputs.outputs.signed == 'true'
        shell: bash
        env:
          APP_IDENTITY: ${{ steps.kc.outputs.app_identity }}
          KC: ${{ steps.kc.outputs.keychain }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          bash contrib/packaging/sign-macos.sh sign ./publish/osx-arm64
          bash contrib/packaging/sign-macos.sh verify ./publish/osx-arm64

      - name: Notarise tswap and libtswapse.dylib
        if: steps.inputs.outputs.signed == 'true'
        shell: bash
        env:
          MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID }}
        run: |
          set -euo pipefail
          bash contrib/packaging/sign-macos.sh zip-for-notary ./publish/osx-arm64 "$RUNNER_TEMP/tswap-osx-arm64.zip"
          bash contrib/packaging/sign-macos.sh notarise "$RUNNER_TEMP/tswap-osx-arm64.zip"

      # The same package.sh as the unsigned path, plus the signature, notarisation and quarantine checks.
      - name: Package and smoke-test the archive (signed)
        if: steps.inputs.outputs.signed == 'true'
        timeout-minutes: 20
        shell: bash
        env:
          TSWAP_EXPECT_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
        run: bash contrib/packaging/package.sh osx-arm64 ./publish/osx-arm64 dist --smoke

      - name: Package and smoke-test the archive (unsigned, fork)
        if: steps.inputs.outputs.signed != 'true'
        timeout-minutes: 10
        shell: bash
        run: bash contrib/packaging/package.sh osx-arm64 ./publish/osx-arm64 dist --smoke

      - name: Build, notarise, check and test-install the pkg
        if: steps.inputs.outputs.signed == 'true'
        shell: bash
        env:
          INSTALLER_IDENTITY: ${{ steps.kc.outputs.installer_identity }}
          KC: ${{ steps.kc.outputs.keychain }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
          MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID }}
        run: |
          set -euo pipefail
          # The version from the "Expected version" step: the tag without its v; a dispatch has no tag, so the csproj's.
          bash contrib/packaging/package-pkg.sh build ./publish/osx-arm64 "$TSWAP_EXPECT_VERSION" dist
          bash contrib/packaging/package-pkg.sh notarise dist/tswap-osx-arm64.pkg
          bash contrib/packaging/package-pkg.sh check dist/tswap-osx-arm64.pkg dist/tswap-osx-arm64.tar.gz
          bash contrib/packaging/package-pkg.sh install-test dist/tswap-osx-arm64.pkg

      - name: Upload the archive and the pkg
        uses: actions/upload-artifact@v4
        with:
          name: tswap-osx-arm64
          path: dist/
          if-no-files-found: error

      - name: Upload the notary logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notary-logs
          path: ${{ runner.temp }}/notary-log-*.json
          if-no-files-found: ignore

      - name: Remove the keychain and any key material
        if: always()
        shell: bash
        run: bash contrib/packaging/sign-macos.sh keychain-cleanup

  release:
    name: Create Release
    needs: [build, build-macos]
    # Tag pushes only: a dispatch (the dry run) never publishes.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the archives
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      # Upstream the signed pkg must be there (fail_on_unmatched_files); a fork's macOS build is unsigned and has none.
      - name: Create GitHub Release
        if: github.repository == 'stevedcc/TokenSwap'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/tswap-linux-x64.tar.gz
            artifacts/tswap-linux-arm64.tar.gz
            artifacts/tswap-osx-arm64.tar.gz
            artifacts/tswap-osx-arm64.pkg
            artifacts/tswap-win-x64.zip

      - name: Create GitHub Release (fork, no pkg)
        if: github.repository != 'stevedcc/TokenSwap'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/tswap-linux-x64.tar.gz
            artifacts/tswap-linux-arm64.tar.gz
            artifacts/tswap-osx-arm64.tar.gz
            artifacts/tswap-win-x64.zip
