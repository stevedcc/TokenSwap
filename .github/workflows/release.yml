name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The unit tests ci.yml runs (its Linux leg also runs E2E against a Debug AOT binary; the
      # hardware categories need real devices). The build legs below smoke-test each shipped binary.
      - name: Install bubblewrap (sandbox tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --unshare-pid --die-with-parent --ro-bind / / --proc /proc --dev /dev -- /bin/true

      - name: Test
        env:
          CI_REQUIRE_BWRAP: '1'
        shell: bash
        run: |
          set -o pipefail
          TSWAP_TEST_KEY=$(openssl rand -hex 32) dotnet test TokenSwap.slnx \
            --filter "Category!=E2E&Category!=SecureEnclave&Category!=Tpm&Category!=TpmWindows" | tee "$RUNNER_TEMP/test.log"
          # A filter that matches no tests exits 0: require one summary line with tests in it.
          grep -qE '^Passed! +- Failed: +0, Passed: +[1-9][0-9]*,' "$RUNNER_TEMP/test.log" \
            || { echo "::error::no 'Passed!' summary with tests in it: no tests ran, or some failed" >&2; exit 1; }

  verify-version:
    name: Verify Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches csproj version
        run: |
          TAG="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG#v}"
          CSPROJ_VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' TswapCli/TswapCli.csproj)
          echo "Tag version:    $TAG_VERSION"
          echo "Csproj version: $CSPROJ_VERSION"
          if [ "$TAG_VERSION" != "$CSPROJ_VERSION" ]; then
            echo "ERROR: Tag $TAG does not match <Version>$CSPROJ_VERSION</Version> in TswapCli/TswapCli.csproj"
            exit 1
          fi

  build:
    needs: [test, verify-version]
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-arm64
            os: macos-latest
          - rid: win-x64
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install native build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish
        run: >
          dotnet publish TswapCli/TswapCli.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --output ./publish/${{ matrix.rid }}

      # Run the shipped (Release, NativeAOT) binary once on its own platform: a command that needs
      # no vault, so a binary that doesn't start fails the release here.
      # Package here, on the binary's own platform, then extract the archive into an empty folder
      # and run what is in it: the smoke test runs the shipped bytes with the shipped permissions
      # (upload-artifact doesn't keep the execute bit, so the archive is made before the upload).
      # `prompt-hash` needs no vault.
      - name: Package and smoke-test the archive (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          chmod +x ./publish/${{ matrix.rid }}/tswap
          tar czf "dist/tswap-${{ matrix.rid }}.tar.gz" -C ./publish/${{ matrix.rid }} tswap
          check="$(mktemp -d)"
          tar xzf "dist/tswap-${{ matrix.rid }}.tar.gz" -C "$check"
          "$check/tswap" prompt-hash

      - name: Package and smoke-test the archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path ./publish/${{ matrix.rid }}/tswap.exe -DestinationPath dist/tswap-${{ matrix.rid }}.zip
          $check = Join-Path $env:RUNNER_TEMP 'tswap-check'
          Expand-Archive dist/tswap-${{ matrix.rid }}.zip -DestinationPath $check
          & (Join-Path $check 'tswap.exe') prompt-hash
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: tswap-${{ matrix.rid }}
          path: dist/
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the archives
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/tswap-linux-x64.tar.gz
            artifacts/tswap-linux-arm64.tar.gz
            artifacts/tswap-osx-arm64.tar.gz
            artifacts/tswap-win-x64.zip
