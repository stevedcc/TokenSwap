name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # A dry run of the signed macOS build (issue #240): the same signing, notarisation and checks as a tag run, then the
  # archive, the pkg and the notary logs are uploaded as artifacts. A dispatch never publishes, whatever the input says;
  # the input makes that explicit in the UI. The macos-signing environment allows only main and v* tags.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (a dispatch never publishes a release)'
        type: boolean
        default: true
  # Brief T15: a pull request that changes what ships (the SDK, project or build files, this workflow) runs the test
  # job and the build legs too, so each shipped runtime identifier is built, packed and smoke-tested before a tag.
  # Nothing is published from a pull request, and it never reaches the macos-signing environment (verify-version and
  # release run on a tag push only, build-macos never on a pull request (ci.yml builds, packs and smoke-tests the
  # unsigned osx-arm64 archive on every pull request)).
  pull_request:
    paths:
      - global.json
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - nuget.config
      - '**/packages.lock.json'
      - '*.slnx'
      - .github/workflows/release.yml

# Every job reads only, unless it says otherwise: Create Release writes the release, bump-version opens its PR, and
# attest gets id-token: write and attestations: write (job-scoped) to sign and store the build provenance.
permissions:
  contents: read

jobs:
  test:
    name: Test
    # 24.04, the image the Linux binaries are built on; ci.yml also runs 26.04 (#339).
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The unit tests ci.yml runs (its Linux leg also runs E2E against a Debug AOT binary; the
      # hardware categories need real devices). The build legs below smoke-test each shipped binary.
      - name: Install bubblewrap (sandbox tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --unshare-pid --die-with-parent --ro-bind / / --proc /proc --dev /dev -- /bin/true

      # As in ci.yml: the JIT test host loads the YubiKey SDK's own Yubico.NativeShims.so, which links
      # libpcsclite.so.1 (SdkFido2KeysTests' salt tests go through its ECDH). Only this job installs it; the build
      # legs below smoke-test the shipped binary, which links tswap's PC/SC stand-in and must start without it.
      - name: libpcsclite for the JIT test host
        run: sudo apt-get install -y libpcsclite1

      # Brief T19 (review F7): as in ci.yml, the binding smoke test (Libfido2SmokeTests) needs libfido2, and fails
      # instead of skipping under CI_REQUIRE_LIBFIDO2=1. This job is the release's only test leg (Linux).
      - name: libfido2 for the binding smoke test
        run: sudo apt-get install -y libfido2-1

      - name: Test
        env:
          CI_REQUIRE_BWRAP: '1'
          CI_REQUIRE_LIBFIDO2: '1'
        shell: bash
        run: |
          set -o pipefail
          TSWAP_TEST_KEY=$(openssl rand -hex 32) dotnet test TokenSwap.slnx \
            --filter "Category!=E2E&Category!=SecureEnclave&Category!=Tpm&Category!=TpmWindows&Category!=YubiKey&Category!=Perf" | tee "$RUNNER_TEMP/test.log"
          # A filter that matches no tests exits 0: require one summary line with tests in it.
          grep -qE '^Passed! +- Failed: +0, Passed: +[1-9][0-9]*,' "$RUNNER_TEMP/test.log" \
            || { echo "::error::no 'Passed!' summary with tests in it: no tests ran, or some failed" >&2; exit 1; }

  verify-version:
    name: Verify Version
    # Tag pushes only; a dispatch has no tag to compare (the jobs below accept it as skipped).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches csproj version
        run: |
          TAG="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG#v}"
          CSPROJ_VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' TswapCli/TswapCli.csproj)
          echo "Tag version:    $TAG_VERSION"
          echo "Csproj version: $CSPROJ_VERSION"
          if [ "$TAG_VERSION" != "$CSPROJ_VERSION" ]; then
            echo "ERROR: Tag $TAG does not match <Version>$CSPROJ_VERSION</Version> in TswapCli/TswapCli.csproj"
            exit 1
          fi

  build:
    needs: [test, verify-version]
    # A skipped need (verify-version on a dispatch) would otherwise skip this job.
    if: always() && needs.test.result == 'success' && (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped')
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - rid: linux-x64
            # 24.04, like linux-arm64: a NativeAOT binary needs at least the glibc of the image it was built on,
            # so building on 26.04 would stop the release running on older distributions.
            os: ubuntu-24.04
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: win-x64
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Brief T18 and its addendum (owner, 2026-11-09): what the shipped binary's `tswap --version` must report, for the
      # smoke tests (package.sh --smoke reads TSWAP_EXPECT_VERSION; the Windows smoke checks it itself). A release
      # build, release.yml on a tag push (its publishes pass -p:TswapReleaseBuild=true then, and only then), reports
      # the tag without its v (a prerelease tag keeps its suffix, v0.3.0-rc.1 -> 0.3.0-rc.1, as verify-version
      # compares). Every other build (a dispatch, even on a tag; a PR; a push to main) reports TswapCli.csproj's
      # <Version>-pre-<first 7 of the commit built>: HEAD, the commit checked out (on a PR, the merge commit, which is
      # GITHUB_SHA), which the SDK embeds in the binary. TSWAP_VERSION is the plain version, for the pkg.
      - name: Expected version (for the smoke tests' tswap --version)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
            expect=$version
          else
            version=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' TswapCli/TswapCli.csproj | head -n 1)
            commit=$(git rev-parse HEAD)
            echo "commit built: $commit (GITHUB_SHA: $GITHUB_SHA)"
            expect=$version-pre-${commit:0:7}
          fi
          if [ -z "$version" ]; then
            echo "::error::no version: neither a tag nor a <Version> in TswapCli/TswapCli.csproj" >&2
            exit 1
          fi
          echo "TSWAP_VERSION=$version" >> "$GITHUB_ENV"
          echo "TSWAP_EXPECT_VERSION=$expect" >> "$GITHUB_ENV"
          echo "version: $version; tswap --version must print: tswap $expect"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install native build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish
        run: >
          dotnet publish TswapCli/TswapCli.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --output ./publish/${{ matrix.rid }}
          -p:TswapReleaseBuild=${{ github.event_name == 'push' && github.ref_type == 'tag' }}

      # Run the shipped (Release, NativeAOT) binary once on its own platform: a command that needs
      # no vault, so a binary that doesn't start fails the release here.
      # Package here, on the binary's own platform, then extract the archive into an empty folder
      # and run what is in it: the smoke test runs the shipped bytes with the shipped permissions
      # (upload-artifact doesn't keep the execute bit, so the archive is made before the upload).
      # `prompt-hash` needs no vault. contrib/packaging/package.sh also packs the macOS Secure Enclave
      # dylib next to the binary, and on macOS makes and unlocks a throwaway Secure Enclave vault with
      # the unpacked tswap, which loads the dylib from the archive (issue #238); CI runs the same script.
      - name: Package and smoke-test the archive (Linux, macOS)
        if: runner.os != 'Windows'
        timeout-minutes: 10
        shell: bash
        run: bash contrib/packaging/package.sh "${{ matrix.rid }}" "./publish/${{ matrix.rid }}" dist --smoke

      - name: Package and smoke-test the archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path ./publish/${{ matrix.rid }}/tswap.exe -DestinationPath dist/tswap-${{ matrix.rid }}.zip
          $check = Join-Path $env:RUNNER_TEMP 'tswap-check'
          Expand-Archive dist/tswap-${{ matrix.rid }}.zip -DestinationPath $check
          # Brief T18: the whole stdout of --version, its line ending trimmed, is `tswap <expected version>`.
          # Exactly one line (a second, even a blank one, is a mismatch), compared case-sensitively.
          $out = @(& (Join-Path $check 'tswap.exe') --version)
          $code = $LASTEXITCODE
          $line = ($out -join "`n").TrimEnd("`r", "`n")
          if ($code -ne 0 -or $out.Count -ne 1 -or $line -cne "tswap $env:TSWAP_EXPECT_VERSION") {
            Write-Output "::error::tswap --version printed '$line' (exit $code), expected 'tswap $env:TSWAP_EXPECT_VERSION'"
            exit 1
          }
          Write-Output "tswap --version: $line"
          & (Join-Path $check 'tswap.exe') prompt-hash
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The YubiKey smoke package.sh runs on Linux and macOS (YubiKey SDK stage 1, task 4): a serial no YubiKey has,
          # never --replace, so the only expected outcome is the refusal.
          $ErrorActionPreference = 'Continue'
          $out = (& (Join-Path $check 'tswap.exe') yubikey setup --touch --serial 2147483647 2>&1 | ForEach-Object { "$_" }) -join "`n"
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -eq 0 -or -not $out.Contains('YubiKey 2147483647 is not plugged in')) {
            Write-Output "::error::tswap yubikey setup --touch --serial 2147483647 should refuse with 'YubiKey 2147483647 is not plugged in' (exit $code)"
            exit 1
          }
          exit 0

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: tswap-${{ matrix.rid }}
          path: dist/
          if-no-files-found: error

  # The macOS build, signed and notarised (issue #240; plan docs/superpowers/plans/2026-11-07-macos-signing.md). Bound
  # to the macos-signing environment, which holds the secrets and waits for the owner's approval on every run; it starts
  # only once the tests passed, so no approval, signing or notarisation is spent on a red commit. Upstream
  # (stevedcc/TokenSwap) a missing secret fails the release; a fork builds the archive unsigned, with no pkg.
  # The report-only checks (contrib/packaging/macos/runner-checks.sh) gate once TSWAP_MACOS_GATE_RUNNER_CHECKS: '1' is
  # added to env: below, after the first dry run's strings are in the checks (plan task 10).
  build-macos:
    name: Build osx-arm64 (signed)
    needs: [test, verify-version]
    # Tag pushes and dispatches only: a pull request run must not ask for the environment or its signing inputs.
    if: always() && github.event_name != 'pull_request' && needs.test.result == 'success' && (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped')
    runs-on: macos-latest
    # Two notary waits of up to 40 minutes each, plus the build, the smoke and the install test.
    timeout-minutes: 120
    permissions:
      contents: read
    environment: macos-signing
    env:
      SIGNING_REQUIRED: ${{ github.repository == 'stevedcc/TokenSwap' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Brief T18 and its addendum (owner, 2026-11-09): what the shipped binary's `tswap --version` must report, for the
      # smoke tests (package.sh --smoke reads TSWAP_EXPECT_VERSION; the Windows smoke checks it itself). A release
      # build, release.yml on a tag push (its publishes pass -p:TswapReleaseBuild=true then, and only then), reports
      # the tag without its v (a prerelease tag keeps its suffix, v0.3.0-rc.1 -> 0.3.0-rc.1, as verify-version
      # compares). Every other build (a dispatch, even on a tag; a PR; a push to main) reports TswapCli.csproj's
      # <Version>-pre-<first 7 of the commit built>: HEAD, the commit checked out (on a PR, the merge commit, which is
      # GITHUB_SHA), which the SDK embeds in the binary. TSWAP_VERSION is the plain version, for the pkg.
      - name: Expected version (for the smoke tests' tswap --version)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
            expect=$version
          else
            version=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' TswapCli/TswapCli.csproj | head -n 1)
            commit=$(git rev-parse HEAD)
            echo "commit built: $commit (GITHUB_SHA: $GITHUB_SHA)"
            expect=$version-pre-${commit:0:7}
          fi
          if [ -z "$version" ]; then
            echo "::error::no version: neither a tag nor a <Version> in TswapCli/TswapCli.csproj" >&2
            exit 1
          fi
          echo "TSWAP_VERSION=$version" >> "$GITHUB_ENV"
          echo "TSWAP_EXPECT_VERSION=$expect" >> "$GITHUB_ENV"
          echo "version: $version; tswap --version must print: tswap $expect"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Whether each input is there (true/false only: no value reaches this step).
      - name: Signing inputs
        id: inputs
        shell: bash
        env:
          HAVE_MACOS_SIGN_APP_P12_BASE64: ${{ secrets.MACOS_SIGN_APP_P12_BASE64 != '' }}
          HAVE_MACOS_SIGN_INSTALLER_P12_BASE64: ${{ secrets.MACOS_SIGN_INSTALLER_P12_BASE64 != '' }}
          HAVE_MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD != '' }}
          HAVE_MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 != '' }}
          HAVE_MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID != '' }}
          HAVE_MACOS_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID != '' }}
          HAVE_MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID != '' }}
        run: |
          set -euo pipefail
          if [ "$SIGNING_REQUIRED" != true ]; then
            echo "::warning::not stevedcc/TokenSwap: the macOS archive is built unsigned, and there is no pkg"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=
          for name in MACOS_SIGN_APP_P12_BASE64 MACOS_SIGN_INSTALLER_P12_BASE64 MACOS_SIGN_P12_PASSWORD \
                      MACOS_NOTARY_KEY_P8_BASE64 MACOS_NOTARY_ISSUER_ID MACOS_NOTARY_KEY_ID MACOS_TEAM_ID; do
            have="HAVE_$name"
            [ "${!have}" = true ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::the macos-signing environment lacks:$missing (plan G5); the release is not built unsigned (D5)"
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Throwaway keychain with the Developer ID identities
        id: kc
        if: steps.inputs.outputs.signed == 'true'
        shell: bash
        env:
          MACOS_SIGN_APP_P12_BASE64: ${{ secrets.MACOS_SIGN_APP_P12_BASE64 }}
          MACOS_SIGN_INSTALLER_P12_BASE64: ${{ secrets.MACOS_SIGN_INSTALLER_P12_BASE64 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
        run: bash contrib/packaging/sign-macos.sh keychain-setup

      # The shim (libtswapse.dylib) is signed inside the build, before it is embedded into tswap for installscript.
      - name: Publish (signed shim)
        if: steps.inputs.outputs.signed == 'true'
        run: >
          dotnet publish TswapCli/TswapCli.csproj
          --configuration Release
          --runtime osx-arm64
          --output ./publish/osx-arm64
          -p:TswapMacSignIdentity=${{ steps.kc.outputs.app_identity }}
          -p:TswapMacSignKeychain=${{ steps.kc.outputs.keychain }}
          -p:TswapReleaseBuild=${{ github.event_name == 'push' && github.ref_type == 'tag' }}

      - name: Publish (unsigned, fork)
        if: steps.inputs.outputs.signed != 'true'
        run: >
          dotnet publish TswapCli/TswapCli.csproj
          --configuration Release
          --runtime osx-arm64
          --output ./publish/osx-arm64
          -p:TswapReleaseBuild=${{ github.event_name == 'push' && github.ref_type == 'tag' }}

      - name: Sign tswap and verify both files
        if: steps.inputs.outputs.signed == 'true'
        shell: bash
        env:
          APP_IDENTITY: ${{ steps.kc.outputs.app_identity }}
          KC: ${{ steps.kc.outputs.keychain }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          bash contrib/packaging/sign-macos.sh sign ./publish/osx-arm64
          bash contrib/packaging/sign-macos.sh verify ./publish/osx-arm64

      - name: Notarise tswap and libtswapse.dylib
        if: steps.inputs.outputs.signed == 'true'
        shell: bash
        env:
          MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID }}
        run: |
          set -euo pipefail
          bash contrib/packaging/sign-macos.sh zip-for-notary ./publish/osx-arm64 "$RUNNER_TEMP/tswap-osx-arm64.zip"
          bash contrib/packaging/sign-macos.sh notarise "$RUNNER_TEMP/tswap-osx-arm64.zip"

      # The same package.sh as the unsigned path, plus the signature, notarisation and quarantine checks.
      - name: Package and smoke-test the archive (signed)
        if: steps.inputs.outputs.signed == 'true'
        timeout-minutes: 20
        shell: bash
        env:
          TSWAP_EXPECT_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
        run: bash contrib/packaging/package.sh osx-arm64 ./publish/osx-arm64 dist --smoke

      - name: Package and smoke-test the archive (unsigned, fork)
        if: steps.inputs.outputs.signed != 'true'
        timeout-minutes: 10
        shell: bash
        run: bash contrib/packaging/package.sh osx-arm64 ./publish/osx-arm64 dist --smoke

      - name: Build, notarise, check and test-install the pkg
        if: steps.inputs.outputs.signed == 'true'
        shell: bash
        env:
          INSTALLER_IDENTITY: ${{ steps.kc.outputs.installer_identity }}
          KC: ${{ steps.kc.outputs.keychain }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
          MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID }}
        run: |
          set -euo pipefail
          # The plain version from the "Expected version" step (the tag without its v; on a dispatch, the csproj's):
          # never the -pre form, which package-pkg.sh doesn't need (the pkg is built on tag runs and dry runs only).
          bash contrib/packaging/package-pkg.sh build ./publish/osx-arm64 "$TSWAP_VERSION" dist
          bash contrib/packaging/package-pkg.sh notarise dist/tswap-osx-arm64.pkg
          bash contrib/packaging/package-pkg.sh check dist/tswap-osx-arm64.pkg dist/tswap-osx-arm64.tar.gz
          bash contrib/packaging/package-pkg.sh install-test dist/tswap-osx-arm64.pkg

      - name: Upload the archive and the pkg
        uses: actions/upload-artifact@v4
        with:
          name: tswap-osx-arm64
          path: dist/
          if-no-files-found: error

      - name: Upload the notary logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notary-logs
          path: ${{ runner.temp }}/notary-log-*.json
          if-no-files-found: ignore

      - name: Remove the keychain and any key material
        if: always()
        shell: bash
        run: bash contrib/packaging/sign-macos.sh keychain-cleanup

  # The Windows exe, signed with the owner's Certum code-signing key (issue #368; maintainer's side:
  # docs/windows-signing.md). The key lives in Certum's cloud HSM and a login needs a 6-digit TOTP code, whose seed never
  # reaches GitHub: this job asks for one code on the private issue stevedcc/tswap-signing#1, accepts only the owner's
  # reply, deletes and masks it, signs at once (contrib/packaging/sign-windows.sh) and replaces the win-x64 artifact.
  # Bound to the windows-signing environment (the owner's approval on every run); upstream only, never on a pull
  # request. A fork's release ships the unsigned exe (attest accepts this job and verify-windows as skipped there).
  sign-windows:
    name: Sign win-x64
    needs: [build]
    if: always() && github.event_name != 'pull_request' && github.repository == 'stevedcc/TokenSwap' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment: windows-signing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Whether each input is there (true/false only: no value reaches this step).
      - name: Signing inputs
        shell: bash
        env:
          HAVE_CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL != '' }}
          HAVE_SIGNING_ISSUES_TOKEN: ${{ secrets.SIGNING_ISSUES_TOKEN != '' }}
        run: |
          set -euo pipefail
          missing=
          for name in CERTUM_EMAIL SIGNING_ISSUES_TOKEN; do
            have="HAVE_$name"
            [ "${!have}" = true ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::the windows-signing environment lacks:$missing; the release is not built unsigned"
            exit 1
          fi

      # Built before the code is asked for, so compiling doesn't eat its 30 s window. ssign (MIT, Rust) is pinned by
      # commit; the "# vX.Y.Z" at the end of the line below is the version Renovate reads (renovate.json5, the ssign
      # manager), so keep that shape. It talks only to Certum's signing and timestamp servers. Each bump: read the
      # ssign diff (it handles the signing login), then one dry run (Release, Run workflow with `dry_run`, on the Renovate branch before you merge if the windows-signing environment allows that branch, else on main before you tag), which signs with a real code and publishes nothing, before tagging.
      - name: Build ssign
        shell: bash
        run: cargo install --locked --git https://github.com/Le-Syl21/ssign --rev 367bf7d3da14d5041d5e47f855ae2397b8028e33 ssign --root "$RUNNER_TEMP/ssign" # v0.1.11

      - name: Download the unsigned archive
        uses: actions/download-artifact@v4
        with:
          name: tswap-win-x64
          path: dist

      - name: Unpack tswap.exe
        shell: bash
        run: |
          set -euo pipefail
          entries=$(unzip -Z1 dist/tswap-win-x64.zip)
          if [ "$entries" != tswap.exe ]; then
            echo "::error::dist/tswap-win-x64.zip holds more than tswap.exe: $entries"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/win"
          unzip -q dist/tswap-win-x64.zip -d "$RUNNER_TEMP/win"
          # The hash the request comment names, for the owner to compare (docs/windows-signing.md).
          echo "tswap.exe SHA-256: $(sha256sum "$RUNNER_TEMP/win/tswap.exe" | cut -d ' ' -f 1)"

      - name: Ask for a signing code
        id: request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SIGNING_ISSUES_TOKEN }}
        run: |
          set -euo pipefail
          id=$(bash contrib/packaging/sign-windows.sh request "$RUNNER_TEMP/win/tswap.exe")
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Sign tswap.exe with the owner's code
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SIGNING_ISSUES_TOKEN }}
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          SSIGN: ${{ runner.temp }}/ssign/bin/ssign
          REQUEST_ID: ${{ steps.request.outputs.id }}
        run: bash contrib/packaging/sign-windows.sh sign "$RUNNER_TEMP/win/tswap.exe" "$REQUEST_ID"

      # The same layout as build's Compress-Archive: tswap.exe alone, at the root of a fresh zip.
      - name: Repack the signed exe
        shell: bash
        run: |
          set -euo pipefail
          rm -f dist/tswap-win-x64.zip
          zip -j -X dist/tswap-win-x64.zip "$RUNNER_TEMP/win/tswap.exe"
          entries=$(unzip -Z1 dist/tswap-win-x64.zip)
          if [ "$entries" != tswap.exe ]; then
            echo "::error::the repacked zip holds more than tswap.exe: $entries"
            exit 1
          fi

      # Replaces build's unsigned artifact for verify-windows, attest and Create Release.
      - name: Upload the signed archive
        uses: actions/upload-artifact@v4
        with:
          name: tswap-win-x64
          path: dist/
          overwrite: true
          if-no-files-found: error

  # Checks the signed exe on Windows itself, with no environment and no secret: a valid Authenticode signature by the
  # expected certificate, a timestamp, signtool's own verdict, and the version the release must report.
  verify-windows:
    name: Verify win-x64 signature
    needs: [sign-windows]
    if: always() && github.event_name != 'pull_request' && github.repository == 'stevedcc/TokenSwap' && needs.sign-windows.result == 'success'
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # Certum Open Source Developer Steven Crawford, valid to 2027-11-20: renew with the certificate
      # The SHA-1 of the leaf certificate, as `certutil -user -store My` and `signtool verify /pa /v` showed it on the
      # owner's laptop on 2026-11-20: https://github.com/stevedcc/TokenSwap/issues/368#issuecomment-7043611776
      EXPECTED_THUMBPRINT: 0117383ED6ABD3650EEA4365C9565D19AD147877

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The same step as build's: what the signed tswap.exe's `tswap --version` must report.
      - name: Expected version (for the smoke tests' tswap --version)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
            expect=$version
          else
            version=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' TswapCli/TswapCli.csproj | head -n 1)
            commit=$(git rev-parse HEAD)
            echo "commit built: $commit (GITHUB_SHA: $GITHUB_SHA)"
            expect=$version-pre-${commit:0:7}
          fi
          if [ -z "$version" ]; then
            echo "::error::no version: neither a tag nor a <Version> in TswapCli/TswapCli.csproj" >&2
            exit 1
          fi
          echo "TSWAP_VERSION=$version" >> "$GITHUB_ENV"
          echo "TSWAP_EXPECT_VERSION=$expect" >> "$GITHUB_ENV"
          echo "version: $version; tswap --version must print: tswap $expect"

      - name: Download the signed archive
        uses: actions/download-artifact@v4
        with:
          name: tswap-win-x64
          path: dist

      - name: Expand the archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $check = Join-Path $env:RUNNER_TEMP 'tswap-signed'
          Expand-Archive dist/tswap-win-x64.zip -DestinationPath $check
          $files = @(Get-ChildItem -Recurse -Force $check)
          if ($files.Count -ne 1 -or $files[0].Name -cne 'tswap.exe') {
            Write-Output "::error::tswap-win-x64.zip holds $($files.Count) entries ($(($files | ForEach-Object Name) -join ', ')), not tswap.exe alone"
            exit 1
          }

      - name: Check the Authenticode signature
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:RUNNER_TEMP 'tswap-signed\tswap.exe'
          $sig = Get-AuthenticodeSignature $exe
          if ($sig.Status -ne 'Valid') {
            Write-Output "::error::the signature's status is $($sig.Status) ($($sig.StatusMessage)), not Valid"
            exit 1
          }
          if ($sig.SignerCertificate.Thumbprint -cne $env:EXPECTED_THUMBPRINT) {
            Write-Output "::error::signed by $($sig.SignerCertificate.Subject), thumbprint $($sig.SignerCertificate.Thumbprint), not $env:EXPECTED_THUMBPRINT"
            exit 1
          }
          if ($null -eq $sig.TimeStamperCertificate) {
            Write-Output "::error::the signature has no timestamp"
            exit 1
          }
          Write-Output "signed by $($sig.SignerCertificate.Subject), timestamped by $($sig.TimeStamperCertificate.Subject)"

      - name: signtool verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:RUNNER_TEMP 'tswap-signed\tswap.exe'
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object { $v = $null; if ([version]::TryParse($_.Directory.Parent.Name, [ref]$v)) { $v } else { [version]'0.0' } } -Descending |
            Select-Object -First 1
          if ($null -eq $signtool) {
            Write-Output "::error::no signtool.exe under ${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64"
            exit 1
          }
          & $signtool.FullName verify /pa /v $exe
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::signtool verify /pa /v failed (exit $LASTEXITCODE)"
            exit 1
          }

      # build's Windows check, verbatim (brief T18): the signed bytes still run and report the expected version.
      - name: Run the signed tswap.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $check = Join-Path $env:RUNNER_TEMP 'tswap-signed'
          $out = @(& (Join-Path $check 'tswap.exe') --version)
          $code = $LASTEXITCODE
          $line = ($out -join "`n").TrimEnd("`r", "`n")
          if ($code -ne 0 -or $out.Count -ne 1 -or $line -cne "tswap $env:TSWAP_EXPECT_VERSION") {
            Write-Output "::error::tswap --version printed '$line' (exit $code), expected 'tswap $env:TSWAP_EXPECT_VERSION'"
            exit 1
          }
          Write-Output "tswap --version: $line"

  attest:
    # Build provenance (issue #371): one signed SLSA attestation, kept by GitHub, that each release file (its SHA-256)
    # was built by this workflow from this commit at this ref; users check it with `gh attestation verify`. It signs
    # with the job's own OIDC identity, so no secret is needed. build and build-macos upload only finished files (the
    # macOS ones after signing and notarisation; Windows signing, #368, replaces the win-x64 artifact in sign-windows,
    # before verify-windows and this job), so the bytes attested here are the bytes Create Release publishes: keep it that way. A dispatch dry run attests its
    # -pre build too (harmless: the provenance is true for those bytes). A private fork needs Enterprise Cloud for
    # attestations; without them it publishes no release.
    name: Attest build provenance
    needs: [build, build-macos, verify-windows]
    if: always() && github.event_name != 'pull_request' && needs.build.result == 'success' && needs.build-macos.result == 'success' && (needs.verify-windows.result == 'success' || (github.repository != 'stevedcc/TokenSwap' && needs.verify-windows.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download the archives
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      # The files the release publishes, as Create Release lists them: upstream all five, a fork has no pkg.
      - name: List the subjects
        id: subjects
        shell: bash
        env:
          UPSTREAM: ${{ github.repository == 'stevedcc/TokenSwap' }}
        run: |
          set -euo pipefail
          files=(
            "artifacts/tswap-linux-x64.tar.gz"
            "artifacts/tswap-linux-arm64.tar.gz"
            "artifacts/tswap-osx-arm64.tar.gz"
            "artifacts/tswap-osx-arm64.pkg"
            "artifacts/tswap-win-x64.zip"
          )
          present=()
          missing=
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              present+=("$file")
            elif [ "$UPSTREAM" = true ] || [ "$file" != artifacts/tswap-osx-arm64.pkg ]; then
              missing="$missing $file"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::no release file to attest:$missing" >&2
            exit 1
          fi
          {
            echo "subjects<<EOF"
            printf '%s\n' "${present[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          printf 'subject: %s\n' "${present[@]}"

      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.subjects.outputs.subjects }}

      # The command docs/install.md gives users, on each file attested: the attestation is there and checkable.
      - name: Verify each subject
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECTS: ${{ steps.subjects.outputs.subjects }}
        run: |
          set -euo pipefail
          verified=0
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            echo "verifying $file"
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
            verified=$((verified + 1))
          done <<< "$SUBJECTS"
          if [ "$verified" -eq 0 ]; then
            echo "::error::no subject to verify" >&2
            exit 1
          fi
          echo "verified $verified files"

  release:
    name: Create Release
    needs: [build, build-macos, attest]
    # Tag pushes only: a dispatch (the dry run) never publishes.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the archives
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      # Upstream the signed pkg must be there (fail_on_unmatched_files); a fork's macOS build is unsigned and has none.
      - name: Create GitHub Release
        if: github.repository == 'stevedcc/TokenSwap'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          # A suffixed tag (v0.3.1-rc.1) is a prerelease: never shown as the latest release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/tswap-linux-x64.tar.gz
            artifacts/tswap-linux-arm64.tar.gz
            artifacts/tswap-osx-arm64.tar.gz
            artifacts/tswap-osx-arm64.pkg
            artifacts/tswap-win-x64.zip

      - name: Create GitHub Release (fork, no pkg)
        if: github.repository != 'stevedcc/TokenSwap'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          # A suffixed tag (v0.3.1-rc.1) is a prerelease: never shown as the latest release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/tswap-linux-x64.tar.gz
            artifacts/tswap-linux-arm64.tar.gz
            artifacts/tswap-osx-arm64.tar.gz
            artifacts/tswap-win-x64.zip

  # Brief T18 addendum (owner, 2026-11-09): after a release, main's <Version> moves to the next patch, so a development
  # build reads as "pre the next release" (v0.3.0 tagged: main to 0.3.1, whose builds report 0.3.1-pre-<commit>). This
  # job opens that PR from main's head; the owner merges it, and nothing here pushes to main. A prerelease tag bumps
  # nothing (contrib/packaging/next-version.sh). Idempotent: on a re-run the branch and the PR are found and left as
  # they are. Needs the repository setting "Allow GitHub Actions to create and approve pull requests" (Settings >
  # Actions > General), or the PR is refused. A PR opened with the job's token starts no workflow, so the job
  # dispatches ci.yml on the branch; those runs are on the PR's commit and show as its checks.
  bump-version:
    name: Open the version bump PR
    needs: [release]
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump <Version> on a branch and open the PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=${GITHUB_REF_NAME#v}
          next=$(bash contrib/packaging/next-version.sh "$tag")
          if [ -z "$next" ]; then
            echo "::notice::v$tag is a prerelease: main's <Version> stays until the final release"
            exit 0
          fi
          csproj=TswapCli/TswapCli.csproj
          current=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' "$csproj" | head -n 1)
          if [ "$current" = "$next" ]; then
            echo "::notice::main's <Version> is already $next: nothing to bump"
            exit 0
          fi
          if [ "$current" != "$tag" ]; then
            echo "::notice::main's <Version> is $current, not v$tag's $tag: it has moved on, so nothing to bump"
            exit 0
          fi
          branch=release/bump-$next
          title="Version $next for development (after v$tag)"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "the branch $branch is already there"
          else
            # no sed -i: GNU and BSD sed read its argument differently, and a test runs this step on macOS
            sed "s:<Version>${tag//./\\.}</Version>:<Version>$next</Version>:" "$csproj" > "$csproj.new"
            mv "$csproj.new" "$csproj"
            if [ "$(grep -c "<Version>$next</Version>" "$csproj")" -ne 1 ]; then
              echo "::error::could not set <Version>$next</Version> in $csproj" >&2
              exit 1
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git switch -c "$branch"
            git commit -m "$title" -- "$csproj"
            git push origin "HEAD:refs/heads/$branch"
          fi
          if [ -n "$(gh pr list --head "$branch" --base main --state open --json number --jq '.[].number')" ]; then
            echo "a PR from $branch is already open: nothing more to do"
            exit 0
          fi
          gh pr create --base main --head "$branch" --title "Version $next for development (after v$tag)" \
            --body "Opened by release.yml after v$tag: main's <Version> moves to $next, so development builds report $next-pre-<commit>. ci.yml was dispatched on this branch (a PR opened by a workflow starts none itself)."
          gh workflow run ci.yml --ref "$branch"
