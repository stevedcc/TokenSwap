name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Deterministic key for the TSWAP_TEST_KEY bypass (Debug builds only).
  # Not a secret: it stubs YubiKey hardware calls in tests and has no meaning
  # outside a throwaway test vault.
  TSWAP_TEST_KEY: "0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF"

jobs:
  build-test-publish:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build TokenSwap.slnx

      # The skill eval (evals/skill, SkillEvalTests in the unit tests) runs agents in a bubblewrap
      # sandbox. GitHub's Ubuntu runners have no bwrap, and Ubuntu 24.04 restricts unprivileged
      # user namespaces through AppArmor; without both the eval tests would only skip.
      - name: Enable the skill eval sandbox (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --unshare-pid --die-with-parent --ro-bind / / --proc /proc --dev /dev -- /bin/true

      # Brief T11: GitHub's macOS runners are virtual machines and may have no Secure Enclave.
      # Print what the probe says (tswap_se_available() returns CryptoKit's SecureEnclave.isAvailable),
      # so the first run answers whether SecureEnclaveNoTouchRoundTripTests can run here. Those
      # tests skip with a message when it is false; CI_REQUIRE_SE=1 would make them fail instead
      # (not set yet: it is set once a run shows the probe is true).
      - name: Secure Enclave probe (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          probe="$RUNNER_TEMP/se-probe.swift"
          printf '%s\n' 'import CryptoKit' 'print("Secure Enclave available: \(SecureEnclave.isAvailable)")' > "$probe"
          swift "$probe"

      - name: Unit tests (in-process)
        # CI_REQUIRE_BWRAP=1 on Linux: the eval tests fail instead of skipping when bwrap is unusable.
        env:
          CI_REQUIRE_BWRAP: ${{ runner.os == 'Linux' && '1' || '' }}
        run: dotnet test TokenSwap.slnx --no-build --filter "Category!=E2E&Category!=SecureEnclave&Category!=Tpm&Category!=TpmWindows"

      # NativeAOT publish is the tripwire for AOT-incompatible changes
      # (reflection, unsupported patterns) that a plain build won't catch.
      - name: AOT publish
        run: dotnet publish TswapCli/TswapCli.csproj -c Release

      # E2E smoke tests exercise the real binary as a subprocess (run/PTY/installscript).
      # A Debug AOT publish is used so the TSWAP_TEST_KEY bypass (Debug-only) exists in
      # the binary — this step tests NativeAOT-compiled behaviour on every OS. On macOS
      # the outer-PTY tests exercise the real MacOSPty forkpty path; on Windows the
      # outer-ConPTY test exercises the real WindowsPty path (POSIX-only PTY tests
      # self-skip there).
      - name: E2E tests (NativeAOT binary)
        timeout-minutes: 15
        shell: bash
        run: |
          dotnet publish TswapCli/TswapCli.csproj -c Debug
          # Select exactly one published binary deterministically; fail fast if none.
          BINARY=$(find "$PWD/TswapCli/bin/Debug" -type f \( -path '*/publish/tswap' -o -path '*/publish/tswap.exe' \) -print -quit)
          if [ -z "$BINARY" ]; then
            echo "::error::no published tswap binary found under TswapCli/bin/Debug" >&2
            exit 1
          fi
          # Git Bash paths (/d/a/...) are not valid for .NET on Windows; convert.
          if command -v cygpath >/dev/null 2>&1; then BINARY=$(cygpath -w "$BINARY"); fi
          TSWAP_E2E_BINARY="$BINARY" \
            dotnet test TswapTests/TswapTests.csproj --no-build --filter "Category=E2E"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: tswap-${{ matrix.os }}
          path: TswapCli/bin/Release/net10.0/*/publish/tswap*
          if-no-files-found: error

