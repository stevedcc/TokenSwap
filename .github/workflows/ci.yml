name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Deterministic key for the TSWAP_TEST_KEY bypass (Debug builds only).
  # Not a secret: it stubs YubiKey hardware calls in tests and has no meaning
  # outside a throwaway test vault.
  TSWAP_TEST_KEY: "0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF"

jobs:
  build-test-publish:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build TokenSwap.slnx

      # The skill eval (evals/skill, SkillEvalTests in the unit tests) runs agents in a bubblewrap
      # sandbox, and the broker's command templates (BrokerSandboxTests, BrokerTemplateCallTests)
      # run every template under bwrap. GitHub's Ubuntu runners have no bwrap, and Ubuntu 24.04
      # restricts unprivileged user namespaces through AppArmor; without both those tests would only skip.
      - name: Enable the bubblewrap sandbox (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --unshare-pid --die-with-parent --ro-bind / / --proc /proc --dev /dev -- /bin/true

      # Brief T11: print whether this runner has a Secure Enclave (tswap_se_available() returns
      # CryptoKit's SecureEnclave.isAvailable). It printed true on macos-latest (PR #203, run
      # 41114279617), so the unit-test step below sets CI_REQUIRE_SE=1 on macOS.
      - name: Secure Enclave probe (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          probe="$RUNNER_TEMP/se-probe.swift"
          printf '%s\n' 'import CryptoKit' 'print("Secure Enclave available: \(SecureEnclave.isAvailable)")' > "$probe"
          swift "$probe"

      - name: Unit tests (in-process)
        # CI_REQUIRE_BWRAP=1 on Linux: the eval and template sandbox tests fail instead of skipping when bwrap is unusable.
        # CI_REQUIRE_SE=1 on macOS only (it means "this machine must have a Secure Enclave", so never
        # workflow-wide): SecureEnclaveNoTouchRoundTripTests fail instead of skipping when the
        # Secure Enclave round trip can't run, because the probe showed these runners have one.
        env:
          CI_REQUIRE_BWRAP: ${{ runner.os == 'Linux' && '1' || '' }}
          CI_REQUIRE_SE: ${{ runner.os == 'macOS' && '1' || '' }}
        run: dotnet test TokenSwap.slnx --no-build --filter "Category!=E2E&Category!=SecureEnclave&Category!=Tpm&Category!=TpmWindows&Category!=YubiKey"

      # NativeAOT publish is the tripwire for AOT-incompatible changes
      # (reflection, unsupported patterns) that a plain build won't catch.
      - name: AOT publish
        run: dotnet publish TswapCli/TswapCli.csproj -c Release

      # Windows: the published binary's YubiKey smoke (YubiKey SDK stage 1, task 4; macOS and Linux run the same line in
      # package.sh --smoke below). 2147483647 is outside the range YubiKey serials use, so it can never select, let alone
      # program, a key that happens to be plugged in, and the line never passes --replace: the only expected outcome is
      # the refusal, which also shows the YubiKey SDK starts in the shipped binary.
      - name: YubiKey smoke (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = @(Get-ChildItem -Path TswapCli/bin/Release -Recurse -Filter tswap.exe | Where-Object { $_.Directory.Name -eq 'publish' })
          if ($exe.Count -ne 1) { Write-Output "::error::expected exactly one published tswap.exe, found $($exe.Count)"; exit 1 }
          $out = (& $exe[0].FullName yubikey setup --touch --serial 2147483647 2>&1 | ForEach-Object { "$_" }) -join "`n"
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -eq 0 -or -not $out.Contains('YubiKey 2147483647 is not plugged in')) {
            Write-Output "::error::tswap yubikey setup --touch --serial 2147483647 should refuse with 'YubiKey 2147483647 is not plugged in' (exit $code)"
            exit 1
          }
          exit 0

      # The release archive, packed and smoke-tested by the script release.yml uses, so a PR that breaks
      # packaging (issue #238: the macOS archive lacked libtswapse.dylib) fails here, not at tag time.
      # The rid comes from the publish folder's parent (bin/Release/net10.0/<rid>/publish); exactly one such
      # folder must exist, and package.sh refuses a rid it doesn't know, so a wrong pick fails instead of
      # packing a Linux-style archive that tests nothing about the dylib.
      - name: Package and smoke-test the release archive (Linux, macOS)
        if: runner.os != 'Windows'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          publish_dirs=$(find "$PWD/TswapCli/bin/Release" -type d -path '*/publish')
          if [ "$(printf '%s\n' "$publish_dirs" | grep -c .)" -ne 1 ]; then
            echo "::error::expected exactly one Release publish folder under TswapCli/bin/Release, found: ${publish_dirs:-none}" >&2
            exit 1
          fi
          publish=$publish_dirs
          rid=$(basename "$(dirname "$publish")")
          bash contrib/packaging/package.sh "$rid" "$publish" "$RUNNER_TEMP/dist" --smoke

      # E2E smoke tests exercise the real binary as a subprocess (run/PTY/installscript).
      # A Debug AOT publish is used so the TSWAP_TEST_KEY bypass (Debug-only) exists in
      # the binary — this step tests NativeAOT-compiled behaviour on every OS. On macOS
      # the outer-PTY tests exercise the real MacOSPty forkpty path; on Windows the
      # outer-ConPTY test exercises the real WindowsPty path (POSIX-only PTY tests
      # self-skip there).
      - name: E2E tests (NativeAOT binary)
        timeout-minutes: 15
        shell: bash
        run: |
          dotnet publish TswapCli/TswapCli.csproj -c Debug
          # Select exactly one published binary deterministically; fail fast if none.
          BINARY=$(find "$PWD/TswapCli/bin/Debug" -type f \( -path '*/publish/tswap' -o -path '*/publish/tswap.exe' \) -print -quit)
          if [ -z "$BINARY" ]; then
            echo "::error::no published tswap binary found under TswapCli/bin/Debug" >&2
            exit 1
          fi
          # Git Bash paths (/d/a/...) are not valid for .NET on Windows; convert.
          if command -v cygpath >/dev/null 2>&1; then BINARY=$(cygpath -w "$BINARY"); fi
          TSWAP_E2E_BINARY="$BINARY" \
            dotnet test TswapTests/TswapTests.csproj --no-build --filter "Category=E2E"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: tswap-${{ matrix.os }}
          path: TswapCli/bin/Release/net10.0/*/publish/tswap*
          if-no-files-found: error

