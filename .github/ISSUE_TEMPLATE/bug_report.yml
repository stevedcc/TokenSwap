name: Bug report
description: Something tswap does wrong, crashes on, or says in a confusing way.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never paste a secret value**, not even a burned one. For output that may contain
        secrets, save it to a file and run `tswap redact output.txt > redacted.txt`, then paste **redacted.txt**.
        Don't paste the terminal: `redact`'s warnings there quote the lines they flag, unmasked. Delete both files
        afterwards. `redact` masks only values your vault knows, so check for anything else yourself (a recovery
        key, a vault password, a value you never stored).

        If a secret does land in an issue, editing the issue is not enough: burn and rotate it
        ([rotating and burning](https://github.com/stevedcc/TokenSwap/blob/main/docs/rotating-and-burning.md)).

        A security vulnerability goes to a [private report](https://github.com/stevedcc/TokenSwap/security/advisories/new), not here.
  - type: input
    id: version
    attributes:
      label: tswap version
      description: The output of `tswap --version`.
      placeholder: tswap 0.3.1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: os-detail
    attributes:
      label: OS version and shell
      description: For example "Fedora 44, bash", "macOS 27.2, zsh", "Windows 11, Windows PowerShell 5.1 in the classic console".
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How tswap was installed
      options:
        - Release download (zip, tar.gz or pkg)
        - Install script
        - Built from source
        - Other
  - type: dropdown
    id: slot
    attributes:
      label: What opens the vault on this machine
      multiple: true
      options:
        - YubiKey (challenge-response)
        - FIDO2 security key
        - TPM
        - Secure Enclave
        - Vault password / tswap agent
        - Recovery key
        - Not relevant
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw. The full output goes in the Output field below.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How you got there
      description: |
        The steps from a working vault to the problem, one per line, with the commands as you typed them
        (`{{tokens}}` as written, never their values). For example: enrolled a second machine, synced the folder,
        ran `tswap rotate db-pw` on both, then `tswap run ...`.
      placeholder: |
        1. tswap init --yubikey
        2. tswap create db-pw
        3. tswap run psql "postgresql://app:{{db-pw}}@db/app"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The full output, as `tswap redact` wrote it to a file (not its terminal warnings), or with every secret value removed by hand.
      render: text
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Before you submit
      options:
        - label: This report contains no secret values.
          required: true
